[package]
name = "oxiri"
version = "0.3.1"
authors = ["Tpt <thomas@pellissier-tanon.fr>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/oxiri"
keywords = ["IRI"]
repository = "https://github.com/oxigraph/oxiri"
description = """
Simple and fast implementation of IRI validation and relative IRI resolution
"""
edition = "2021"
rust-version = "1.83"

[features]
default = ["std"]
std = ["memchr/std", "serde?/std"]

[dependencies]
memchr = { version = "2.3", default-features = false }
serde = { version = "1.0.217", optional = true, default-features = false }

[dev-dependencies]
codspeed-criterion-compat = ">=4.4.1, <7"
serde_test = "1"

[[bench]]
name = "lib"
harness = false

[package.metadata.docs.rs]
all-features = true
